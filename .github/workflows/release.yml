name: Release Image

# ============================================================================
#  自动构建并推送镜像到 GitHub Container Registry (ghcr.io)
#
#  触发方式：
#    1. 推送形如 v1.0.0 的 tag  → 构建并推送 <版本> + latest
#    2. 在 Actions 页面手动点 Run workflow
#
#  产物：ghcr.io/<你的用户名>/rss-media-hub:latest
#        ghcr.io/<你的用户名>/rss-media-hub:v1.0.0
#
#  注意：
#    * <你的用户名> 会被自动替换成仓库 owner，且强制转成小写（ghcr 不接受大写）
#    * 第一次推送后，去 GitHub 仓库 → Packages 里把该包的可见性设为 Public，
#      否则 NAS 上拉取需要 docker login
# ============================================================================

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的版本号（例如 v1.0.1），留空则只用 latest'
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 先跑测试，测试不过就不构建镜像 —— 避免把一个跑不起来的镜像推上 registry
  test:
    runs-on: ubuntu-latest
    name: test (py3.12)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name (lowercase)
        id: prep
        run: echo "image=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU（为了支持 arm64 交叉构建）
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Prepare version info
        id: ver
        run: |
          echo "commit=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME:-}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # amd64 给绿联云/群晖等 x86 NAS，arm64 给树莓派与 ARM 机型
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 构建信息注入镜像：界面左上角会显示「版本 · 提交」，
          # 这样 pull 之后能直接确认跑的是哪次构建
          build-args: |
            RMH_BUILD_COMMIT=${{ steps.ver.outputs.commit }}
            RMH_BUILD_TIME=${{ steps.ver.outputs.time }}
            RMH_BUILD_TAG=${{ steps.ver.outputs.tag }}
          # cache-from/to 让后续构建快很多
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 关掉 provenance 附件：某些 NAS 的镜像导入/拉取对它不友好
          provenance: false

      - name: Summary
        run: |
          {
            echo "## 镜像已推送 :rocket:"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "在 compose 里这样用："
            echo ""
            echo '```yaml'
            echo "image: ${{ steps.prep.outputs.image }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
