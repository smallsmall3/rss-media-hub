name: Tests

# ============================================================================
#  每次 push / PR 自动跑单元测试
#  测试全部离线（不联网、不需要任何密钥），所以 CI 里很稳
# ============================================================================

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # 保险：任何一步卡住，10 分钟就判失败并释放 runner，
    # 而不是一直挂着（曾经因为跑了常驻的 `app run` 卡到超时）
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    name: test (py${{ matrix.python-version }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile check
        run: python -m compileall -q app tests

      - name: Run unit tests
        run: |
          set -o pipefail
          # tee 一份到文件：下一步会把失败详情写进 job summary，
          # 这样不用登录也能在 run 首页看到哪个测试挂了。
          python -m unittest discover -s tests -t . -v 2>&1 | tee /tmp/test-output.txt

      - name: 把测试结果写入 job summary（失败时也能直接看到）
        if: always()
        run: |
          {
            echo "## 测试输出（py${{ matrix.python-version }}）"
            echo ""
            echo '```'
            if [ -f /tmp/test-output.txt ]; then
              # 只留失败摘要 + 结尾统计，避免 summary 太长
              grep -E '^(FAIL|ERROR):|AssertionError|^Ran |^OK|^FAILED' /tmp/test-output.txt | head -60 || true
              echo "---- 最后 40 行 ----"
              tail -40 /tmp/test-output.txt
            else
              echo "没有拿到测试输出"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: CLI smoke test（确认能正常启动，且会生成配置模板）
        run: |
          set -e
          export RMH_CONFIG_DIR="$PWD/.ci-config"
          export RMH_STATE_DIR="$PWD/.ci-state"
          export RMH_HEALTH_PORT=0
          # 极短超时：CI 里配置的都是假地址，别为了等超时耗掉半分钟
          export RMH_TG_BOT_TOKEN="1:CI"
          export RMH_TG_CHAT_ID="1"
          export RMH_HTTP_TIMEOUT=2
          export RMH_POLL_INTERVAL=3600
          # 注意：不要用 `python -m app run` —— 那是常驻轮询循环，永不退出，
          # 会让这个 step 一直卡到超时。用 smoke：走完整启动流程后自己停下。
          python -m app --config-dir "$RMH_CONFIG_DIR" --state-dir "$RMH_STATE_DIR" smoke
          test -f "$RMH_CONFIG_DIR/subscriptions.yaml" || { echo "没有生成 subscriptions.yaml"; exit 1; }
          test -f "$RMH_CONFIG_DIR/config.yaml" || { echo "没有生成 config.yaml"; exit 1; }
          python -m app --config-dir "$RMH_CONFIG_DIR" --state-dir "$RMH_STATE_DIR" --version

      - name: 部署自检（离线，确保 selfcheck 本身没坏）
        if: always()
        run: |
          export RMH_CONFIG_DIR="$PWD/.ci-config"
          export RMH_STATE_DIR="$PWD/.ci-state"
          python -m app --config-dir "$RMH_CONFIG_DIR" --state-dir "$RMH_STATE_DIR" selfcheck || true
