name: Tests

# ============================================================================
#  每次 push / PR 自动跑单元测试
#  测试全部离线（不联网、不需要任何密钥），所以 CI 里很稳
# ============================================================================

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    name: test (py${{ matrix.python-version }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile check
        run: python -m compileall -q app tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: CLI smoke test（确认命令行入口可用，且能生成配置模板）
        run: |
          set -e
          export RMH_CONFIG_DIR="$PWD/.ci-config"
          export RMH_STATE_DIR="$PWD/.ci-state"
          export RMH_HEALTH_PORT=0
          python -m app --config-dir "$RMH_CONFIG_DIR" --state-dir "$RMH_STATE_DIR" run || true
          test -f "$RMH_CONFIG_DIR/subscriptions.yaml" || { echo "没有生成 subscriptions.yaml"; exit 1; }
          python -m app --config-dir "$RMH_CONFIG_DIR" --state-dir "$RMH_STATE_DIR" --version
